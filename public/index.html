
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Expense Tracker</h1>
      <p>Manage your money smarter.</p>
    </div>
  </header>

  <main class="container">
    <section class="summary-grid">
      <article class="summary-card balance-card">
        <p>Current Balance</p>
        <h2 id="balance">₹0.00</h2>
      </article>

      <article class="summary-card">
        <p>Total Income</p>
        <h2 id="income">₹0.00</h2>
      </article>

      <article class="summary-card">
        <p>Total Expenses</p>
        <h2 id="expenses">₹0.00</h2>
      </article>
    </section>

    <section class="panel">
      <h2>Add Transaction</h2>

      <form id="transactionForm">
        <label for="type">Transaction Type</label>
        <select id="type" required>
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>

        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" min="0.01" step="0.01" required>

        <label for="category">Category</label>
        <select id="category" required>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Bills">Bills</option>
          <option value="Salary">Salary</option>
          <option value="Other">Other</option>
        </select>

        <label for="date">Date</label>
        <input id="date" type="date" required>

        <label for="description">Description</label>
        <input id="description" type="text" maxlength="200"
          placeholder="Optional note">

        <button type="submit" id="saveButton">Add Transaction</button>
      </form>

      <p id="message" role="status"></p>
    </section>

    <section class="panel">
      <h2>Monthly Budget</h2>

      <form id="budgetForm" class="budget-form">
        <label for="budgetMonth">Month</label>
        <input id="budgetMonth" type="month" required>

        <label for="budgetAmount">Budget Amount (₹)</label>
        <input id="budgetAmount" type="number" min="0.01"
          step="0.01" required>

        <button type="submit">Save Budget</button>
      </form>

      <p id="budgetSummary">Set a monthly budget to get started.</p>
      <progress id="budgetProgress" value="0" max="100"></progress>
    </section>

    <section class="panel">
      <h2>Expense Breakdown</h2>
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Transaction History</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Category</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="transactionList"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
